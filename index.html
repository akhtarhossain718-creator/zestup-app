<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZestUp — Share Your Vibe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .gradient-bg { background: linear-gradient(135deg, #f97316 0%, #ec4899 100%); }
    .glass { background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center">

  <!-- Top Navbar -->
  <header class="w-full max-w-lg sticky top-0 z-50 glass px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-xl gradient-bg flex items-center justify-center font-extrabold text-white text-xl shadow-lg">Z</div>
      <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-orange-400 to-pink-500 bg-clip-text text-transparent">ZestUp</span>
    </div>
    <button id="logoutBtn" class="hidden text-xs font-semibold px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700">Logout</button>
  </header>

  <!-- Auth Section -->
  <main id="authSection" class="w-full max-w-md px-5 py-10 flex-1 flex flex-col justify-center">
    <div class="glass rounded-3xl p-7 shadow-2xl">
      <h1 id="authTitle" class="text-2xl font-bold text-center mb-1">Welcome to ZestUp</h1>
      <p id="authSubtitle" class="text-sm text-slate-400 text-center mb-6">Sign in to connect and share moments</p>

      <div class="space-y-4">
        <div id="nameField" class="hidden">
          <label class="text-xs font-semibold text-slate-400 uppercase">Full Name</label>
          <input id="userNameInput" type="text" placeholder="e.g. Akhtar Hossain" class="w-full mt-1 px-4 py-3 rounded-xl bg-slate-900/90 border border-slate-700 focus:border-orange-500 focus:outline-none text-sm" />
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-400 uppercase">Email</label>
          <input id="emailInput" type="email" placeholder="you@example.com" class="w-full mt-1 px-4 py-3 rounded-xl bg-slate-900/90 border border-slate-700 focus:border-orange-500 focus:outline-none text-sm" />
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-400 uppercase">Password</label>
          <input id="passwordInput" type="password" placeholder="••••••••" class="w-full mt-1 px-4 py-3 rounded-xl bg-slate-900/90 border border-slate-700 focus:border-orange-500 focus:outline-none text-sm" />
        </div>

        <p id="authError" class="text-xs text-rose-400 hidden"></p>

        <button id="authSubmitBtn" class="w-full py-3.5 rounded-xl gradient-bg font-bold text-white shadow-lg hover:opacity-95 transition">Login</button>
      </div>

      <p class="text-center text-xs text-slate-400 mt-6">
        <span id="toggleText">Don't have an account?</span>
        <button id="toggleAuthBtn" class="text-orange-400 font-bold ml-1 hover:underline">Sign Up</button>
      </p>
    </div>
  </main>

  <!-- Main App Feed Section -->
  <main id="appSection" class="hidden w-full max-w-lg px-4 py-4 pb-24 space-y-5">
    
    <!-- Create Post Card -->
    <div class="glass rounded-2xl p-4 shadow-lg">
      <div class="flex items-center gap-3 mb-3">
        <div id="userAvatar" class="w-10 h-10 rounded-full gradient-bg flex items-center justify-center font-bold text-white">U</div>
        <div>
          <p id="displayUserName" class="text-sm font-bold">User</p>
          <p class="text-[11px] text-slate-400">Public Post</p>
        </div>
      </div>

      <textarea id="postText" rows="2" placeholder="What's on your mind?" class="w-full bg-slate-900/70 rounded-xl p-3 text-sm border border-slate-800 focus:border-orange-500 focus:outline-none resize-none"></textarea>

      <!-- Image Preview -->
      <div id="previewContainer" class="hidden relative mt-2">
        <img id="imagePreview" class="w-full max-h-64 object-cover rounded-xl border border-slate-700" />
        <button id="removeImgBtn" class="absolute top-2 right-2 bg-black/70 text-white text-xs px-2.5 py-1 rounded-full">✕</button>
      </div>

      <div class="flex items-center justify-between mt-3 pt-2 border-t border-slate-800">
        <label class="flex items-center gap-2 text-xs font-semibold text-orange-400 cursor-pointer hover:text-orange-300">
          <span>📷 Add Photo/Video</span>
          <input id="mediaInput" type="file" accept="image/*,video/*" class="hidden" />
        </label>
        <button id="publishBtn" class="px-5 py-2 rounded-xl gradient-bg text-xs font-bold text-white shadow hover:opacity-95 disabled:opacity-50">Post</button>
      </div>
    </div>

    <!-- Posts Feed -->
    <div id="feedContainer" class="space-y-4">
      <p class="text-center text-xs text-slate-500 py-8">Loading posts...</p>
    </div>
  </main>

  <!-- Firebase & App Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, updateDoc, arrayUnion, arrayRemove, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyASSXnd4iUaOXAeWohsLwzU6Z7LA2Ca0-I",
      authDomain: "zestup-11df6.firebaseapp.com",
      projectId: "zestup-11df6",
      storageBucket: "zestup-11df6.firebasestorage.app",
      messagingSenderId: "341512484129",
      appId: "1:341512484129:web:8aaedbc2079b28e69fba60",
      measurementId: "G-BXLVG4MSCN"
    };

    const CLOUDINARY_CLOUD_NAME = "nnahwcuk";
    const CLOUDINARY_UPLOAD_PRESET = "zestup_upload";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let isSignUp = false;
    let selectedFile = null;
    let currentUser = null;

    // UI Elements
    const authSection = document.getElementById('authSection');
    const appSection = document.getElementById('appSection');
    const logoutBtn = document.getElementById('logoutBtn');
    const toggleAuthBtn = document.getElementById('toggleAuthBtn');
    const authTitle = document.getElementById('authTitle');
    const authSubtitle = document.getElementById('authSubtitle');
    const nameField = document.getElementById('nameField');
    const authSubmitBtn = document.getElementById('authSubmitBtn');
    const toggleText = document.getElementById('toggleText');
    const authError = document.getElementById('authError');

    toggleAuthBtn.onclick = () => {
      isSignUp = !isSignUp;
      authTitle.textContent = isSignUp ? "Create ZestUp Account" : "Welcome to ZestUp";
      authSubtitle.textContent = isSignUp ? "Join the community today" : "Sign in to connect and share moments";
      authSubmitBtn.textContent = isSignUp ? "Sign Up" : "Login";
      toggleText.textContent = isSignUp ? "Already have an account?" : "Don't have an account?";
      toggleAuthBtn.textContent = isSignUp ? "Login" : "Sign Up";
      nameField.classList.toggle('hidden', !isSignUp);
      authError.classList.add('hidden');
    };

    authSubmitBtn.onclick = async () => {
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const name = document.getElementById('userNameInput').value.trim();
      authError.classList.add('hidden');

      if (!email || !password) {
        authError.textContent = "Please enter email and password.";
        authError.classList.remove('hidden');
        return;
      }

      try {
        authSubmitBtn.disabled = true;
        authSubmitBtn.textContent = "Please wait...";
        if (isSignUp) {
          const cred = await createUserWithEmailAndPassword(auth, email, password);
          await updateProfile(cred.user, { displayName: name || email.split('@')[0] });
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (err) {
        authError.textContent = err.message;
        authError.classList.remove('hidden');
      } finally {
        authSubmitBtn.disabled = false;
        authSubmitBtn.textContent = isSignUp ? "Sign Up" : "Login";
      }
    };

    logoutBtn.onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        authSection.classList.add('hidden');
        appSection.classList.remove('hidden');
        logoutBtn.classList.remove('hidden');
        const name = user.displayName || user.email.split('@')[0];
        document.getElementById('displayUserName').textContent = name;
        document.getElementById('userAvatar').textContent = name[0].toUpperCase();
        loadPosts();
      } else {
        authSection.classList.remove('hidden');
        appSection.classList.add('hidden');
        logoutBtn.classList.add('hidden');
      }
    });

    // Media Selection
    const mediaInput = document.getElementById('mediaInput');
    const previewContainer = document.getElementById('previewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const removeImgBtn = document.getElementById('removeImgBtn');

    mediaInput.onchange = (e) => {
      selectedFile = e.target.files[0];
      if (selectedFile) {
        imagePreview.src = URL.createObjectURL(selectedFile);
        previewContainer.classList.remove('hidden');
      }
    };

    removeImgBtn.onclick = () => {
      selectedFile = null;
      mediaInput.value = "";
      previewContainer.classList.add('hidden');
    };

    // Publish Post
    const publishBtn = document.getElementById('publishBtn');
    publishBtn.onclick = async () => {
      const text = document.getElementById('postText').value.trim();
      if (!text && !selectedFile) return;

      publishBtn.disabled = true;
      publishBtn.textContent = "Posting...";

      try {
        let mediaUrl = "";
        let mediaType = "image";

        if (selectedFile) {
          const formData = new FormData();
          formData.append("file", selectedFile);
          formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
          const resourceType = selectedFile.type.startsWith("video") ? "video" : "image";
          mediaType = resourceType;

          const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`, {
            method: "POST",
            body: formData
          });
          const data = await res.json();
          if (data.secure_url) mediaUrl = data.secure_url;
        }

        await addDoc(collection(db, "posts"), {
          text,
          mediaUrl,
          mediaType,
          authorName: currentUser.displayName || currentUser.email.split('@')[0],
          authorId: currentUser.uid,
          likes: [],
          createdAt: serverTimestamp()
        });

        document.getElementById('postText').value = "";
        removeImgBtn.click();
      } catch (err) {
        alert("Post failed: " + err.message);
      } finally {
        publishBtn.disabled = false;
        publishBtn.textContent = "Post";
      }
    };

    // Load Feed
    function loadPosts() {
      const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
      onSnapshot(q, (snapshot) => {
        const feed = document.getElementById('feedContainer');
        feed.innerHTML = "";
        if (snapshot.empty) {
          feed.innerHTML = `<p class="text-center text-xs text-slate-500 py-8">No posts yet. Be the first to post on ZestUp!</p>`;
          return;
        }

        snapshot.forEach((docSnap) => {
          const post = docSnap.data();
          const id = docSnap.id;
          const isLiked = post.likes?.includes(currentUser.uid);
          const likeCount = post.likes?.length || 0;

          const card = document.createElement('div');
          card.className = "glass rounded-2xl p-4 space-y-3";
          card.innerHTML = `
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-full bg-slate-700 flex items-center justify-center font-bold text-sm text-orange-400">
                ${(post.authorName || "U")[0].toUpperCase()}
              </div>
              <div>
                <p class="text-sm font-bold">${post.authorName || "User"}</p>
                <p class="text-[10px] text-slate-400">Just now</p>
              </div>
            </div>
            ${post.text ? `<p class="text-sm text-slate-200 leading-relaxed">${post.text}</p>` : ""}
            ${post.mediaUrl ? (post.mediaType === "video"
              ? `<video src="${post.mediaUrl}" controls class="w-full rounded-xl max-h-80 bg-black"></video>`
              : `<img src="${post.mediaUrl}" class="w-full rounded-xl max-h-96 object-cover" />`) : ""}
            <div class="flex items-center gap-4 pt-2 border-t border-slate-800/80">
              <button data-id="${id}" data-liked="${isLiked}" class="like-btn flex items-center gap-1.5 text-xs font-semibold ${isLiked ? 'text-pink-500' : 'text-slate-400 hover:text-white'}">
                <span>${isLiked ? '❤️' : '🤍'}</span> <span>${likeCount} Likes</span>
              </button>
            </div>
          `;
          feed.appendChild(card);
        });

        document.querySelectorAll('.like-btn').forEach(btn => {
          btn.onclick = async () => {
            const postId = btn.dataset.id;
            const liked = btn.dataset.liked === "true";
            const ref = doc(db, "posts", postId);
            await updateDoc(ref, {
              likes: liked ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid)
            });
          };
        });
      });
    }
  </script>
</body>
</html>
